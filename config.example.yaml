# VeridicalDB configuration reference.
# Copy to veridicaldb.yaml (or pass --config <path>) and adjust.
# Every value shown is the built-in default; VERIDICAL_* env vars override
# the common scalars (e.g. VERIDICAL_SERVER_PORT, VERIDICAL_LOG_LEVEL).

server:
  host: 127.0.0.1
  port: 5432                 # PostgreSQL wire protocol
  observability_port: 8081   # /metrics, /health, /debug/pprof
  max_connections: 100       # 0 = unlimited
  read_timeout_sec: 30
  write_timeout_sec: 30

storage:
  data_dir: ./data
  page_size: 8192            # power of two, 4096-65536
  buffer_pool_mb: 128
  wal_dir: ""                # empty => <data_dir>/wal
  wal_buffer_kb: 64
  checkpoint_sec: 300

logging:
  level: info                # debug, info, warn, error
  format: text               # text or json
  output: stderr             # stdout, stderr, or a file path

pgwire:
  tls:
    enabled: false
    # cert_file: /path/to/server.crt   # required when enabled
    # key_file:  /path/to/server.key   # required when enabled
    # ca_file:   /path/to/ca.crt       # required for client-cert verification
    # client_auth: none                # none | request | require | verify | require_and_verify
    # min_version: "1.2"               # 1.0 | 1.1 | 1.2 | 1.3
    # max_version: "1.3"

backup:
  # backup_dir defaults to <data_dir>/backups
  # archive_dir defaults to <data_dir>/wal_archive
  compress: true
  retention_days: 30          # 0 = keep forever
  # archive_command: "aws s3 cp %p s3://bucket/wal/%f"
  # restore_command: "aws s3 cp s3://bucket/wal/%f %p"

sharding:
  enabled: false
  shard_key_column: id
  nodes:
    # - host: 127.0.0.1
    #   port: 15432
    # - host: 127.0.0.1
    #   port: 15433
