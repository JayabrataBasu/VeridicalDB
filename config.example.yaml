# VeridicalDB Configuration File
# Copy this to config.yaml and customize as needed

server:
  # Port for TCP connections (used in Stage 5+)
  port: 5432
  # Host address to bind to
  host: "127.0.0.1"
  # Port for observability endpoints (metrics, health, pprof)
  observability_port: 8081

storage:
  # Directory where database files are stored
  data_dir: "./data"
  # Page size in bytes (must be power of 2, 1024-65536)
  page_size: 8192

logging:
  # Minimum log level: debug, info, warn, error
  level: "info"
  # Log format: text or json
  format: "text"
  # Output: stdout, stderr, or file path
  output: "stdout"

# Distributed sharding settings
sharding:
  # Enable coordinator-based sharding
  enabled: false
  # Column used to compute shard routing (must exist in tables)
  shard_key_column: "id"
  # Shard endpoints for the coordinator to connect to
  nodes:
    # - host: "127.0.0.1"
    #   port: 15432
    # - host: "127.0.0.1"
    #   port: 15433

# PostgreSQL wire protocol settings
pgwire:
  # TLS/SSL configuration for secure connections
  tls:
    # Enable TLS for pgwire connections
    enabled: false
    
    # Path to server certificate file (PEM format)
    # Required when TLS is enabled
    # cert_file: "/path/to/server.crt"
    
    # Path to server private key file (PEM format)
    # Required when TLS is enabled
    # key_file: "/path/to/server.key"
    
    # Path to CA certificate file for client certificate validation (optional)
    # Required when client_auth is "verify" or "require_and_verify"
    # ca_file: "/path/to/ca.crt"
    
    # Client authentication policy:
    # - none: Don't request client certificate (default)
    # - request: Request client cert but don't require it
    # - require: Require client cert but don't verify it against CA
    # - verify: Request and verify client cert if provided
    # - require_and_verify: Require and verify client cert (mTLS)
    client_auth: "none"
    
    # Minimum TLS version (default: 1.2)
    # Valid values: "1.0", "1.1", "1.2", "1.3"
    min_version: "1.2"
    
    # Maximum TLS version (optional, defaults to latest supported)
    # Valid values: "1.0", "1.1", "1.2", "1.3"
    # max_version: "1.3"
