[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests requiring server
    slow: Slow running tests

[coverage:run]
source = veridicaldb
omit = 
    */tests/*
    */examples/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
